services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-todoapi-backend}:${TAG:-latest}
    build:
      context: ./backend
      target: final
    environment:
      ConnectionStrings__TodoDb: "Host=postgres;Port=5432;Database=tododb;Username=postgres;Password=postgres"
      Cors__AllowedOrigin: "http://localhost:3001"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:-todoapp-frontend}:${TAG:-latest}
    build:
      context: ./frontend
      target: final
    ports:
      - "3001:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 first and nginx binds IPv4 only.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
