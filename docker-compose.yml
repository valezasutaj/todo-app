services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-todoapi-backend}:${TAG:-latest}
    build:
      context: ./backend
      target: final
    environment:
      ConnectionStrings__TodoDb: "Host=postgres;Port=5432;Database=tododb;Username=postgres;Password=postgres"
      Cors__AllowedOrigin: "http://localhost:3001"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-todoapp-frontend}:${TAG:-latest}
    build:
      context: ./frontend
      target: final
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres-data:
